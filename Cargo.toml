[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
slickbi-spec = { path = "crates/spec" }
slickbi-calc = { path = "crates/calc" }
slickbi-model = { path = "crates/model" }
slickbi-planner = { path = "crates/planner" }
duckdb = { version = "~1.20001.0", features = ["bundled", "json", "parquet"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
