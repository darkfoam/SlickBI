[package]
name = "slickbi-connectors"
description = "SlickBI source adapters: schema discovery and typing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
slickbi-engine.workspace = true
slickbi-spec.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = "0.19"
mysql = { version = "25", default-features = false, features = ["minimal"] }
calamine = "0.38"
iwork = "0.4"

[dev-dependencies]
arrow.workspace = true
slickbi-calc.workspace = true
